<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GPT Queue Enterprise Edition</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style>
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #1a1a1a;
      }

      .container {
        width: 360px;
        background-color: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }

      .logo {
        padding: 24px 0 16px;
        background: linear-gradient(to bottom, #f8fafc, #ffffff);
      }

      .logo img {
        width: 180px;
        height: auto;
        display: block;
        margin: 0 auto;
      }

      .content {
        padding: 20px 28px 24px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 12px;
        text-align: center;
      }

      .enterprise-banner {
        text-align: center;
        margin-bottom: 20px;
      }

      .enterprise-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: linear-gradient(135deg, #1e3a8a, #2563eb);
        color: #ffffff;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.3px;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      }

      .enterprise-sub {
        font-size: 12px;
        color: #64748b;
        margin: 6px 0 0;
        font-weight: 500;
      }

      .collapsible-link {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #2563eb;
        padding: 12px 16px;
        border-radius: 12px;
        background-color: #f8fafc;
        margin: 12px 0;
        font-weight: 500;
        transition: all 0.2s ease;
        cursor: pointer;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #e2e8f0;
        font: inherit;
        text-align: left;
      }

      .collapsible-link:hover {
        background-color: #f1f5f9;
        border-color: #cbd5e1;
        transform: translateY(-1px);
      }

      .collapsible-link:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .collapsible-link i {
        font-size: 15px;
        color: #3b82f6;
      }

      .collapsible-content {
        background-color: #f8fafc;
        border-radius: 12px;
        padding: 16px;
        margin-top: 8px;
        border: 1px solid #e2e8f0;
      }

      #bulkQueueInput {
        width: 100%;
        padding: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 13.5px;
        resize: vertical;
        min-height: 80px;
        background-color: white;
        transition: all 0.2s ease;
        box-sizing: border-box;
      }

      #bulkQueueInput:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      #inputDescription {
        font-size: 12px;
        color: #64748b;
        margin-top: 6px;
      }

      #queueButton {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 11px 20px;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
        width: 100%;
        font-size: 13.5px;
        margin-top: 12px;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      }

      #queueButton:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      }

      #queueButton:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .setting-group {
        margin: 4px 0;
      }

      .setting-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 12.5px;
        color: #64748b;
        font-weight: 500;
      }

      #promptDelay {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 13.5px;
        box-sizing: border-box;
      }

      #promptDelay:focus {
        outline: none;
        border-color: #3b82f6;
      }

      #support {
        display: grid;
        grid-template-columns: repeat(2, auto);
        justify-content: center;
        gap: 20px;
        padding: 16px;
        background-color: #f8fafc;
        border-top: 1px solid #e2e8f0;
      }

      #support a {
        color: #64748b;
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      #support a:hover {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="logo.png" alt="ChatGPT Queue Logo" />
      </div>
      <div class="content">
        <h1>GPT Queue</h1>
        <div class="enterprise-banner">
          <span class="enterprise-badge"><i class="fas fa-university"></i> Enterprise Edition</span>
          <p class="enterprise-sub">Free Forever • Unlimited Student License</p>
        </div>

        <div id="enterprise-features">
          <button
            type="button"
            id="promptChainLink"
            class="collapsible-link"
          >
            <i class="fas fa-layer-group"></i>
            Add prompts in bulk
          </button>
          <div id="bulkInputContainer" style="display: none">
            <textarea
              id="bulkQueueInput"
              placeholder="Ex: prompt1~prompt2~prompt3~prompt4~prompt5"
            ></textarea>
            <div id="inputDescription">Separate multiple prompts with "~"</div>
            <button id="queueButton">Queue Prompts</button>
          </div>

          <button
            type="button"
            id="batchImagesLink"
            class="collapsible-link"
          >
            <i class="fas fa-images" aria-hidden="true"></i>
            Batch image jobs
          </button>

          <button
            type="button"
            id="delaySettingsLink"
            class="collapsible-link"
          >
            <i class="fas fa-clock"></i>
            Delay settings
          </button>
          <div id="delaySettingsContainer" style="display: none">
            <div class="setting-group">
              <label for="promptDelay">Delay between prompts (seconds)</label>
              <input 
                type="number" 
                id="promptDelay" 
                min="0" 
                max="300" 
                value="0" 
                step="1"
                placeholder="0"
              >
            </div>
          </div>
        </div>
      </div>
      <div id="support">
        <a href="https://github.com/MIATECHPARTNERS/ChatGPTQueuePrompts/blob/main/README.md" target="_blank">
          Prompt Library
        </a>
        <a href="https://www.youtube.com/watch?v=TQKBUDKqd_8" target="_blank">
          User Guide
        </a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
